name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /schedify_app/
      # Cronograma Letivo (PWA em React), publicado em /schedify_app/cronograma/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cronograma/package-lock.json
      - run: npm ci
        working-directory: cronograma
      - run: npm test
        working-directory: cronograma
      - run: npm run build
        working-directory: cronograma
        env:
          CRONOGRAMA_BASE: /schedify_app/cronograma/
      - run: cp -r cronograma/dist build/web/cronograma
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
